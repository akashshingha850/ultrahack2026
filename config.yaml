# Coverage Path Planning Configuration

connection:
  # MAVLink connection string
  # Serial: /dev/ttyUSB0 (baud rate applies)
  # UDP:    udp:127.0.0.1:14550
  # TCP:    tcp:127.0.0.1:5760
  # string: "udpin:0.0.0.0:14500"
  string: "/dev/ttyTHS1"
  # baud: 57600
  baud: 115200
  source_system: 255
  timeout: 60               # seconds to wait for heartbeat

flight:
  altitude: 5.0            # metres AGL for survey passes
  speed: 5.0                # m/s groundspeed during coverage
  takeoff_altitude: 5.0    # metres AGL to climb before starting
  rtl_altitude: 5.0        # metres AGL for RTL
  # When the approach loses the target and relocates, roam this much higher on
  # each retry (capped) for a better view — addresses "not high enough to see it".
  search_climb_step_m:     2.0    # extra altitude added per relocate attempt (m)
  max_search_altitude_m:   11.0   # cap on the relocate search altitude (m AGL)

coverage:
  # Radius = FENCE_RADIUS − FENCE_MARGIN (both read from the vehicle).
  # Pass --radius <m> on the CLI for dry-run testing.

  pattern: "spiral"   # boustrophedon | spiral
  spacing: 10.0       # fallback spacing (m) – ignored when camera: block is set
  angle: 0.0          # degrees – rotation of the pattern (0 = north-aligned)
  entry: "nearest"    # boustrophedon only: nearest | first

# Camera: SIYI A8 Mini at 1× zoom.
# Ring spacing is auto-computed as  min(swath_w, swath_h) × (1 – overlap).
camera:
  hfov_deg: 82.6          # horizontal FOV at 1× zoom
  vfov_deg: 52.3          # vertical FOV (4K 16:9, derived from HFOV)
  overlap:   0.10         # 10 % side overlap – enough for surveillance

waypoint:
  acceptance_radius: 2.0    # metres – considered "reached" (NED 2-D distance)
  loiter_time: 0            # seconds to loiter at each waypoint (0 = pass-through)
  timeout: 300              # seconds to wait for each waypoint before aborting

# Survey-grid mission: fly to a handful of stops and spin 360° at each so the
# camera (10-12 m detection range) covers the whole arena between them.
# Start position is random (mission.md), so the grid is laid out *relative to
# the start* and assumed centred in the arena — edge_margin_m shrinks the grid
# so off-centre starts are less likely to push a stop through a wall.
mission:
  arena_length_m:    60.0   # long axis
  arena_width_m:     30.0   # short axis
  num_waypoints:     6
  detection_range_m: 12.0   # camera person-detection radius per 360° spin
  edge_margin_m:     6.0    # keep grid stops this far inside the assumed walls

nbv:
  coverage_target:   0.90   # stop when this fraction of the survey circle is observed
  max_steps:         100    # hard cap on NBV iterations
  min_gain:          1.0    # stop when best information gain falls below this (cells)
  candidate_spacing: 5.0    # metres between candidate grid positions
  grid_resolution:   1.0    # metres per information-grid cell
  dist_penalty:      0.05   # penalise travel distance: score = gain / (1 + penalty * dist)

  # Quality constraints for building detection
  # Drone must physically fly within this range to count a cell as observed.
  max_obs_range_m:   25.0

  # After visiting a position, heavily discount candidates within this radius
  # so the planner explores new viewpoints instead of spinning in place.
  revisit_decay:     0.1    # score multiplier for already-visited vicinity (0–1)
  revisit_radius_m:  5.0    # metres – radius considered "already visited"

stream:
  input:  "rtsp://192.168.144.25:8554/main.264"
  # input:  "rtsp://localhost:8554/live"   # for testing with a local stream (e.g. ffmpeg)
  output: "rtsp://0.0.0.0:8555/live"
  record_dir: "recordings"   # annotated output feed is also saved here as <timestamp>.mp4 ("" = off)

# Detection targets. PRIMARY is what the mission flies to — the smoke plume marks
# the block / fire source. SECONDARY targets are also detected and logged; if ALL
# of them have been seen by the time we reach the block, the orbital scan is
# skipped, otherwise we orbit to catch the ones sitting on the far side.
targets:
  primary:   "smoke"
  secondary: ["human", "fire"]

yolo:
  model:      "ultrahack2026.engine"   # model weights file (downloaded automatically if missing)
  conf:       0.25           # minimum confidence threshold
  imgsz:      640            # inference input size (px)

# Visual-servo approach: once the target class is detected, creep toward it
# while keeping the bottom-centre of its bounding box on the frame centre (yaw
# for horizontal, climb/descend for vertical — the gimbal is never moved), and
# stop when the bbox fills stop_bbox_frac of the frame. Vision only.
approach:
  # The class the approach homes in on is the PRIMARY from the `targets` block.
  # Stop once the bbox fills this fraction of the frame (triggers the orbital
  # scan). If never reached but the target stays in view, the approach still
  # proceeds to the orbit when time_budget_s elapses. Logs "bbox=NN%" each cycle.
  stop_bbox_frac:   0.15       # stop when bbox area ≥ this fraction of the frame
  lidar_stop_m:     4.0        # also stop when a detection coincides with a LiDAR obstacle this close ahead (m)
  speed_mps:        1.0        # gentle forward creep speed (m/s)
  # Horizontal alignment: yaw the nose onto the target.
  yaw_gain:         1.2        # err_x ∈ [-1,1] → yaw rate gain
  max_yaw_deg_s:    45.0       # clamp on yaw slew rate (deg/s)
  center_tol:       0.08       # |err_x| below this counts as centred
  # Vertical alignment: climb/descend to put the bbox bottom-centre on the frame
  # centre (err_y>0 = target low in frame ⇒ descend). Gimbal angle is unchanged.
  vert_align_gain:  0.6        # err_y ∈ [-1,1] → vertical speed gain (m/s per unit)
  descend_speed_mps: 0.7       # clamp on climb/descent rate (m/s)
  center_tol_y:     0.08       # |err_y| below this counts as vertically centred
  # Re-acquire: a full 360° spin can end facing away from a target seen mid-spin.
  # First yaw to the bearing where it was best seen, then wait to re-detect it.
  reacquire_yaw_deg_s: 45.0    # slew rate when re-aiming to the target bearing (deg/s)
  reacquire_timeout_s: 8.0     # how long to wait for re-detection after re-aiming (s)
  # Flaky detection: smoke is far/low-confidence so YOLO flickers. Treat a
  # detection up to detection_max_age_s old as valid; hover through dropouts up
  # to lost_grace_s, then hand back so the mission relocates to new waypoints.
  detection_max_age_s: 1.0     # a detection this old still drives guidance
  lost_grace_s:     4.0        # hover this long through a dropout before relocating
  relocate_retries:  4         # max relocate-and-retry attempts before giving up
  time_budget_s:    60.0       # give up the approach after this long

# Orbital scan: after the approach stops at the target, DESCEND to altitude_m
# (e.g. 3 m) and fly a circle around the target ("the block") with the nose
# pointed inward so the camera captures it from every side. LiDAR-safe: any leg
# whose travel direction is blocked within safe_clear_m is skipped.
orbit:
  radius_m:        6.0    # fallback orbit radius when no forward LiDAR reading (m)
  target_distance_m: 6.0  # fallback distance to the target ahead when no LiDAR (m)
  min_radius_m:    3.0    # never orbit tighter than this, even if LiDAR reads closer (m)
  altitude_m:      3.0    # AGL to descend to before orbiting (null = hold current altitude)
  safe_clear_m:    2.5    # skip an orbit leg if LiDAR clearance toward it is below this (m)
  step_deg:        15.0   # angular spacing between orbit waypoints (deg)
  revolutions:     1.0    # how many full loops to fly
  speed_mps:       1.5    # groundspeed around the orbit (m/s)
  settle_s:        1.5    # pause at each orbit waypoint for a clean frame (s)
  direction:       1      # 1 = clockwise, -1 = counter-clockwise
  accept_rad_m:    1.5    # "reached orbit waypoint" radius (m)
  wp_timeout_s:    20     # per-waypoint timeout (s)

exploration:
  # Replan distance for open_path_explore. Set ABOVE ArduPilot's OA distance
  # (OA_BR_LOOKAHEAD≈3 m, AVOID_MARGIN≈2 m) so our code turns toward an open
  # direction BEFORE the FC's avoidance ever brakes the guided command — that
  # fighting pinned the drone near 0 m/s (logs/2026-06-08_03-32-27.log). The
  # camera detects within ~5–6 m, so stopping 5 m short still means that spot
  # was already covered. 5 m → we redirect early and keep full speed.
  stop_dist_m:      5.0    # replan when a wall is this close ahead (m)
  speed_mps:        5.0    # forward sweep speed (m/s)
  turn_speed_deg_s: 60.0   # yaw rate for 90° lane turns (deg/s)
  # SIYI A8 Mini HFOV 82.6° at 5 m AGL → ground swath ≈ 8.7 m.
  # 8 m lane spacing covers 30 m in 4 passes; still has ~0.7 m overlap.
  lane_width_m:     8.0
  max_steps:        16     # 30 m / 8 m lanes = 4 lanes → 8 fwd + 8 shifts = 16 steps
  step_timeout_s:   12     # 40 m / 5 m/s = 8 s; 12 s gives margin

lidar:
  precheck: true            # pre-flight LiDAR availability check (soft — never aborts)
  precheck_timeout_s: 3.0   # seconds to wait for OBSTACLE_DISTANCE/DISTANCE_SENSOR
  obstacle_distance_rate_hz: 10
  stream_timeout_s: 2.0
  spin_duration_s: 8.0     # floor only; the spin now runs until a tracked full 360°
  spin_max_duration_s: 45.0  # safety cap — stop spinning after this even if 360° not measured
  spin_speed_deg_s: 45.0   # commanded yaw rate (vehicle often yaws slower than this)
  min_valid_range_m: 0.2
  max_valid_range_m: 12.0

logging:
  level: "DEBUG"             # DEBUG | INFO | WARNING | ERROR
  dir: "logs"               # log files written here as logs/YYYY-MM-DD_HH-MM-SS.log
